name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish Linux artifacts
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi

          release_version="${GITHUB_REF_NAME#v}"
          package_id="$(cargo pkgid --manifest-path Cargo.toml)"
          package_version="${package_id##*#}"
          package_version="${package_version##*@}"

          if [[ "${release_version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${package_version}." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Install FFmpeg and Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils dpkg-dev ffmpeg

      - name: Test FFmpeg normalization
        run: cargo test --test ffmpeg_normalization -- --ignored

      - name: Test FFmpeg pause and resume
        run: cargo test --test ffmpeg_pause -- --ignored

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build release archive
        run: ./scripts/package-tarball.sh --skip-build

      - name: Build Debian package
        run: ./scripts/package-linux.sh --skip-build "${GITHUB_REF_NAME#v}"

      - name: Validate Debian package
        run: ./scripts/validate-linux-package.sh "dist/demux_${GITHUB_REF_NAME#v}_amd64.deb"

      - name: Verify clean Debian installation and upgrade
        run: ./scripts/verify-linux-install.sh "dist/demux_${GITHUB_REF_NAME#v}_amd64.deb"

      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check ./*.tar.gz.sha256
          sha256sum --check ./*.deb.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ./dist/*.tar.gz \
            ./dist/*.tar.gz.sha256 \
            ./dist/*.deb \
            ./dist/*.deb.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Demux ${GITHUB_REF_NAME#v}"
