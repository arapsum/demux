[package]
name = "demux"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "demux"
path = "src/bin/main.rs"

[lib]
name = "demux"
path = "src/lib.rs"

[dependencies]
# Iced 0.14 does not emit desktop file-drop events on Wayland. Keep Linux on
# X11/XWayland until upstream implements them so Demux's intake contract works.
iced = { version = "0.14.0", default-features = false, features = ["advanced", "canvas", "crisp", "linux-theme-detection", "thread-pool", "tiny-skia", "tokio", "web-colors", "wgpu", "x11"] }
lucide-icons = { version = "1.31.0", features = ["iced"] }
# Demux runs Iced through X11 on Linux. The portal backend provides native
# pickers without pulling rfd's unused system-linked Wayland client.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "signal", "process", "sync", "time"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
